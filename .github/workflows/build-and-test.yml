name: Build and Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studytracker
          POSTGRES_PASSWORD: studytracker
          POSTGRES_DB: study-tracker-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # Checks-out the repository
      - uses: actions/checkout@v7

      # Install JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      # Get the test properties
      - name: Test properties
        shell: bash
        env:
          TEST_PROPERTIES: ${{secrets.TEST_PROPERTIES}}
        run: 'echo "$TEST_PROPERTIES" > ./web/src/main/resources/application.properties'

      # Build the application
      - name: Maven Package
        run: ./mvnw -B clean package -DskipTests

      # Run tests
      - name: Repository tests
        run: ./mvnw -B -pl web -Dtest="io.studytracker.test.repository.**" test

      - name: Service tests
        run: ./mvnw -B -pl web -Dtest="io.studytracker.test.service.**" test

      - name: Web tests
        run: ./mvnw -B -pl web -Dtest="io.studytracker.test.web.**" test
